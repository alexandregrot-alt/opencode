# Temporary: regenerates bun.lock for the MCP 2.3.1 update and applies in-range security fixes.
# The cloud session that made this branch cannot resolve ghostty-web from GitHub; Actions can.
# Remove this file once the lockfile commit lands.
name: regenerate-lockfile

on:
  push:
    branches: [claude/jolly-thompson-pmvsa4]
    paths: [.github/workflows/regenerate-lockfile.yml]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Regenerate lockfile and apply in-range security fixes
        run: |
          bun install
          bun audit fix || true
          bun install
          bun audit || true

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock package.json packages/*/package.json
          git diff --cached --stat
          git commit --no-verify -m "chore: regenerate lockfile with security updates"
          git push --no-verify
